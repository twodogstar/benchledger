<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1117">
  <title>{% block title %}BenchLedger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/benchledger.css') }}">
  {# Vendored, no CDN: the app must run offline (N9). #}
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/benchledger.js') }}" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <b>BENCH<em>LEDGER</em></b>
        <small>RECORD WHAT HAPPENED</small>
      </div>
      <nav class="nav" aria-label="Main">
        <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/projects" class="{% if active == 'projects' %}active{% endif %}">Projects</a>
        {# Pages below arrive in later iterations; shown disabled so the layout is final. #}
        <span class="soon" title="Iteration 2">Runs</span>
        <span class="soon" title="Iteration 5">Instruments</span>
        <span class="soon" title="Iteration 6">Templates</span>
        <span class="soon" title="Iteration 6">Reports</span>
        <a href="/settings/lists" class="{% if active == 'settings' %}active{% endif %}">Settings</a>
      </nav>
      <div class="side-bottom">
        <span class="signal"></span> v{{ version }} · local only
      </div>
    </aside>
    <main class="main">
      <p class="notice htmx-error" id="htmx-error" role="alert" hidden></p>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
