# Only needed for running the `alembic` command directly (e.g. `uv run alembic revision`).
# `benchledger serve` and `benchledger db upgrade` configure Alembic themselves.
# The database URL comes from the normal BenchLedger settings (see migrations/env.py).

[alembic]
script_location = src/benchledger/migrations
file_template = %%(rev)s_%%(slug)s
